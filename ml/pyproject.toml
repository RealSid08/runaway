[project]
name = "runaway-forecaster"
version = "0.1.0"
description = "Graph neural network that forecasts thermal-runaway propagation across battery enclosures"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "torch>=2.6",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "matplotlib>=3.9",
    "onnxscript>=0.2",
]

[tool.uv]
package = false
